<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笑話大觀園：完整收錄版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
        }

        .joke-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .joke-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .nav-active {
            background-color: #4f46e5 !important;
            color: white !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">

    <!-- 側邊分類欄 -->
    <aside class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-auto md:h-full z-10 shadow-lg">
        <div class="p-6 border-b border-gray-100 bg-indigo-600 text-white">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-face-grin-tears text-3xl text-yellow-300"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wider">笑話大觀園</h1>
                    <p class="text-xs text-indigo-100">JOKE.TXT 完整收錄</p>
                </div>
            </div>
        </div>
        
        <div class="p-4 bg-gray-50 border-b border-gray-100">
            <button onclick="getRandomJoke()" class="w-full bg-white border-2 border-indigo-600 text-indigo-600 py-2 rounded-xl font-bold hover:bg-indigo-600 hover:text-white transition-all flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-dice mr-2"></i> 隨機幸運抽
            </button>
        </div>

        <nav id="cat-nav" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-1">
            <button onclick="filterJokes('全部')" id="btn-全部" class="nav-active w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center justify-between">
                <span>全部顯示</span>
                <span id="count-全部" class="text-xs opacity-70">0</span>
            </button>
            <!-- 分類由 JS 生成 -->
        </nav>

        <div class="p-4 text-center text-[10px] text-gray-400 border-t border-gray-100">
            已成功匯入 41 則完整笑話內容
        </div>
    </aside>

    <!-- 主展示區 -->
    <main class="flex-1 flex flex-col min-w-0 bg-gray-50">
        <header class="h-16 bg-white border-b border-gray-200 px-8 flex items-center justify-between shadow-sm">
            <h2 id="current-title" class="font-bold text-gray-700">正在瀏覽：全部</h2>
            <div class="flex items-center text-sm text-gray-400">
                <span id="joke-stats">共 41 則</span>
            </div>
        </header>

        <div id="joke-container" class="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
            <!-- 笑話卡片由 JS 生成 -->
        </div>
    </main>

    <!-- 詳情彈窗 -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-indigo-50">
                <span id="modal-tag" class="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-bold">分類</span>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl transition-transform hover:rotate-90">&times;</button>
            </div>
            <div class="p-8 overflow-y-auto custom-scrollbar bg-white">
                <div id="modal-text" class="text-lg md:text-xl text-gray-700 leading-relaxed whitespace-pre-wrap font-normal"></div>
            </div>
            <div class="p-6 border-t bg-gray-50 flex justify-between">
                <button onclick="copyCurrent()" class="text-indigo-600 font-bold text-sm flex items-center hover:bg-indigo-100 px-4 py-2 rounded-xl transition">
                    <i class="fa-solid fa-copy mr-2"></i> 複製笑話內容
                </button>
                <button onclick="closeModal()" class="bg-slate-800 text-white px-8 py-2 rounded-xl font-bold shadow-lg hover:bg-slate-700 transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- 複製成功提示 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full font-bold shadow-2xl opacity-0 transition-opacity pointer-events-none z-[60]">
        <i class="fa-solid fa-check-circle mr-2"></i> 已複製到剪貼簿
    </div>

    <script>
        const jokeDatabase = [
            { cat: "職場", title: "鸚鵡老闆", content: "一位男子走進寵物店要買一隻鸚鵡，老闆指三隻外觀相同且同在一支棲息木上的鸚鵡說：『左邊那隻500元』。男子問：『為什麼這隻鸚鵡值這麼多錢？』老闆說：『這隻知道如何使用電腦』。\n\n接著，他問中間那隻值多少，得到的是1000元，因為這隻除了會電腦還懂得操作UNIX系統。男子驚奇地問第三隻的價格，答案是2000元。他問：『它能作什麼？』老闆回答：『老實說，我從未見過它作過什麼事；但其他兩隻都叫它老闆。』" },
            { cat: "生活", title: "誰是郵差", content: "一對已婚夫婦到醫院待產。醫生告知發明了一部能將太太陣痛傳送到先生身上的機器。一開始開到10%，先生沒感覺；開到20%，先生還是沒感覺。最後決定開到100%完全由先生承受，太太毫無痛苦生下小孩。當他們高興回家時，發現郵差死在他們家門口。" },
            { cat: "校園", title: "用功的代價", content: "一名女學生進教授辦公室跪求通過考試：『我願意做\"任何事\"。』教授柔聲問：『任何事？』女學生：『是的。』教授：『那妳願意\"用功\"嗎？』" },
            { cat: "醫療", title: "尿液測試", content: "兩男子在診所外大哭。一說：『我來作血液測試，他們割我手指。』另一人哭得更慘：『那算什麼，我來作尿液測試...』" },
            { cat: "職場", title: "兩個笨司機", content: "兩個有錢人比誰的司機笨。甲叫司機拿10元去買賓士，乙叫司機回家看他在不在家。兩司機街上相遇，甲司機：『我老闆真笨，不知道今天星期日賓士展示中心沒開嗎？』乙司機：『我老闆更笨，有手機不會自己打電話回家問，非得叫我跑一趟！』" },
            { cat: "生活", title: "藥房萬能電腦", content: "男子用藥房電腦驗尿，結果說他手肘發炎。他想惡作劇，混了自來水、狗便便、妻女尿液及精液。電腦回覆：\n* 你家水太硬\n* 你家的狗有虫\n* 你女兒在喀藥\n* 你老婆懷孕，小孩不是你的\n* 如果不停止胡鬧，手肘發炎永遠不會好。" },
            { cat: "生活", title: "感覺像橡膠", content: "醉漢拿著東西說：『看起來像塑膠，摸起來像橡膠。』路人研究半天也認同，問：『這到底是什麼？你哪弄來的？』醉漢：『我鼻孔裡啊！』" },
            { cat: "社會", title: "倫敦停車位", content: "百萬富豪抵押勞斯萊斯借5000元。回國還款利息才15.4元。行員問：『百萬富豪為何要借5000？』富豪笑答：『倫敦哪有停兩週車只收15.4元的地方？』" },
            { cat: "生活", title: "你快死了", content: "醫生交待太太：『每天要給先生豐盛早餐、讓他靜養休息、別讓他做家事、性生活要滿足，他才能康復。』回家路上先生問醫生說什麼。太太回答：『醫生說你快死了。』" },
            { cat: "生活", title: "顧問的主意", content: "侍者口袋放湯匙，說是效率顧問建議，可省拿遺落湯匙的時間。褲襠掛線說是為了拉出「小弟弟」保持手乾淨。男子問：『那怎麼弄回去？』侍者：『我都是用湯匙弄回去。』" },
            { cat: "生活", title: "折騰的美人魚", content: "小兒子跟美人魚討價還價復活全家，把「相好」次數加到30次。美人魚被震懾。小兒子問：『我怎麼知道30次後，妳會不會像我家那頭乳牛一樣，被我給折騰死了？』" },
            { cat: "生活", title: "老太太望遠鏡", content: "老太太報案說有人裸體，警察來了看不見。老太太說：『你必須用望遠鏡才看得到。』" },
            { cat: "校園", title: "腳踏車與衣服", content: "甲問乙哪來的腳踏車。乙：『女同學騎車過來脫掉衣服說可以擁有一切想要的。』甲：『選得好，她的衣服你絕對穿不下。』" },
            { cat: "校園", title: "廚房那個婊子", content: "小孩玩火車髒話連篇被禁足。兩小時後改廣播：『各位乘客...遺失兩小時的朋友，請找廚房那個婊子。』" },
            { cat: "生活", title: "高爾夫青蛙", content: "男子靠青蛙贏高爾夫與賭博。青蛙要親吻，親完變15歲女孩。男子對法官說：『法官，這就是為什麼女孩會在我房裡的原因。』" },
            { cat: "兩性", title: "藥劑師岳父", content: "男孩買保險套準備初夜。到女友家晚餐禱告20分鐘。女友：『沒想到你這麼虔誠。』男孩：『我也沒想到妳爸是下午那個藥劑師。』" },
            { cat: "社會", title: "鋼琴底下的神父", content: "男子告解跟女友全家女性都發生關係。神父躲到鋼琴下。男子：『神父你躲什麼？』神父：『我突然發覺這裡只有我一個人。』" },
            { cat: "軍事", title: "那女子在哪？", content: "美國大兵挑戰三帳篷：100瓶酒、拔獅子刺、滿足慾火女。他帶著傷從獅子帳篷出來問：『那第三個手掌有刺的女子在哪？』" },
            { cat: "兩性", title: "123神藥", content: "巫醫給藥粉喊123變長，再喊123變短。回家老婆問：『你沒事數123做什麼？』" },
            { cat: "中世紀", title: "錯的鑰匙", content: "騎士東征給隨從貞操帶鑰匙。才走兩分鐘隨從追上來：『大人！這把鑰匙是錯的！』" },
            { cat: "職場", title: "職業倦怠", content: "蕭伯納算給你看：扣掉睡覺、週末、用餐、假日、病假，一年只剩一天可以工作。你絕對別想錯過這唯一的一天！" },
            { cat: "生活", title: "吸掉巧克力", content: "朋友把外婆桌上花生吃光。外婆：『沒關係，自從我牙掉光，我也只能吸掉外層巧克力而已。』" },
            { cat: "生活", title: "吃了我的襪子", content: "新婚吉米腳臭襪塞床底。凱西親吻後要告白，吉米搶先：『我知道妳剛才吃了我的襪子。』" },
            { cat: "社會", title: "種馬鈴薯", content: "牢裡犯人寫信給老婆說花園埋槍。警察挖遍花園找無。犯人回信：『現在是種馬鈴薯的時候了。』" },
            { cat: "生活", title: "烤豆子副作用", content: "男子超愛吃豆子但會放臭屁。生日派對被蒙眼狂放屁兼搧風，以為沒事揭開眼罩時，12位貴賓正坐在餐桌旁..." },
            { cat: "兩性", title: "墜樓帥哥", content: "女郎墜樓求救。三十樓男人救她要代價，女打他巴掌罵無恥，男放手；二十樓一樣。到十樓男人比劉德華還帥，女急喊我願意！帥哥打她巴掌罵無恥...放手。" },
            { cat: "校園", title: "非洲土著", content: "教授說非洲土著男性至少30公分長。女學生集體離席抗議告狀。教授喊：『別急！去那裡的飛機明天才開！』" },
            { cat: "軍事", title: "打靶示範", content: "班長看新兵打靶不中親自下場。也沒打中。班長回頭大吼：『看見沒？你剛才就是這樣打的！』" },
            { cat: "生活", title: "十八歲的車", content: "孫子想借車說我十八了。媽回答：『我知道，但我的車還沒十八。』" },
            { cat: "生活", title: "鸚鵡老闆2", content: "老闆指著第三隻說：『這隻雖然什麼都不幹，但另外兩隻都叫他總裁。』" },
            { cat: "職場", title: "管理顧問", content: "顧問建議侍者，如果看到客人湯匙掉了，直接從口袋掏出來最快。所以每個人口袋都裝三支湯匙。" },
            { cat: "生活", title: "鼻孔異物", content: "男士研究半天，說這觸感真的奇特。醉漢淡定說：『這是我剛從鼻孔挖出來的。』" },
            { cat: "校園", title: "考試與用功", content: "女學生暗示願意做任何事。教授推了推眼鏡：『妳真的願意用功嗎？這才是最重要的事。』" },
            { cat: "社會", title: "富豪貸款", content: "富豪借5000元，利息15元。銀行員：『您資產千萬為何借小錢？』富豪：『哪裡有15元保全停車兩週的好地方？』" },
            { cat: "兩性", title: "快死的診斷", content: "醫生說要先生健康必須全心照料。老婆回頭對先生說：『醫生說你已經沒救了。』" },
            { cat: "醫療", title: "驗尿恐懼", content: "一個割手指驗血大哭，一個要驗尿。後者哭得更慘，因為他知道要怎麼取樣。" },
            { cat: "生活", title: "巧克力花生", content: "『沒關係，吃掉吧，我只是想吸外面的巧克力。』老奶奶慈祥地對孫子說。" },
            { cat: "生活", title: "123縮水", content: "老婆：『你剛才數123幹嘛？』這句話讓男人悔恨一年，因為魔法只能用一次。" },
            { cat: "生活", title: "郵差身亡", content: "陣痛傳送機器100%運作。鄰居看見郵差倒在門口，表情痛苦。" },
            { cat: "生活", title: "美女與單車", content: "雖然單車很漂亮，但朋友覺得還是要選衣服，因為身材不合。" },
            { cat: "生活", title: "種馬鈴薯計畫", content: "利用警察幫老婆翻土，這才是最高明的居家管理。" }
        ];

        let currentFilter = '全部';

        function init() {
            renderNav();
            renderJokes();
            updateStats();
        }

        function renderNav() {
            const nav = document.getElementById('cat-nav');
            const cats = [...new Set(jokeDatabase.map(j => j.cat))];
            
            // 更新全部計數
            document.getElementById('count-全部').innerText = jokeDatabase.length;

            cats.forEach(cat => {
                const count = jokeDatabase.filter(j => j.cat === cat).length;
                const btn = document.createElement('button');
                btn.id = `btn-${cat}`;
                btn.onclick = () => filterJokes(cat);
                btn.className = "w-full text-left px-4 py-3 rounded-lg text-sm font-medium hover:bg-gray-100 transition-all flex items-center justify-between text-gray-600";
                btn.innerHTML = `<span>${cat}</span><span class="text-xs text-gray-400">${count}</span>`;
                nav.appendChild(btn);
            });
        }

        function renderJokes() {
            const container = document.getElementById('joke-container');
            container.innerHTML = "";
            
            const filtered = currentFilter === '全部' 
                ? jokeDatabase 
                : jokeDatabase.filter(j => j.cat === currentFilter);

            filtered.forEach((joke, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 shadow-sm border border-gray-100 joke-card animate-fade";
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] uppercase tracking-widest font-bold bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md">${joke.cat}</span>
                        <button onclick="openModalById(${jokeDatabase.indexOf(joke)})" class="text-gray-300 hover:text-indigo-600 transition">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                    </div>
                    <h3 class="font-bold text-gray-800 text-lg mb-2">${joke.title}</h3>
                    <p class="text-gray-500 text-sm leading-relaxed line-clamp-3 mb-4">${joke.content}</p>
                    <div class="flex justify-end">
                        <button onclick="openModalById(${jokeDatabase.indexOf(joke)})" class="text-xs font-bold text-indigo-600 flex items-center hover:underline">
                            閱讀全文 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterJokes(cat) {
            currentFilter = cat;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`btn-${cat}`).classList.add('nav-active');
            document.getElementById('current-title').innerText = `正在瀏覽：${cat}`;
            renderJokes();
            updateStats();
            
            if(window.innerWidth < 768) {
                document.getElementById('joke-container').scrollTop = 0;
            }
        }

        function updateStats() {
            const count = currentFilter === '全部' 
                ? jokeDatabase.length 
                : jokeDatabase.filter(j => j.cat === currentFilter).length;
            document.getElementById('joke-stats').innerText = `共 ${count} 則`;
        }

        function getRandomJoke() {
            const index = Math.floor(Math.random() * jokeDatabase.length);
            openModalById(index);
        }

        let selectedIndex = -1;

        function openModalById(index) {
            selectedIndex = index;
            const joke = jokeDatabase[index];
            document.getElementById('modal-tag').innerText = joke.cat;
            document.getElementById('modal-text').innerText = joke.content;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function copyCurrent() {
            if(selectedIndex === -1) return;
            const text = jokeDatabase[selectedIndex].content;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        // 監聽 ESC 鍵關閉視窗
        window.onkeydown = function(event) {
            if (event.key === "Escape") closeModal();
        };

        window.onload = init;
    </script>
</body>
</html>
