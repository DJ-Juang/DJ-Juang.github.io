        // 初始化收藏資料
        function initFavorites() {
            try {
                const saved = localStorage.getItem('magic_favorites');
                favorites = saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error("無法存取 localStorage:", e);
                favorites = [];
            }
        }

        // 解析 YouTube ID
        function getYoutubeId(url) {
            let id = '';
            try {
                if (url.includes('shorts/')) id = url.split('shorts/')[1].split(/[?#&]/)[0];
                else if (url.includes('v=')) id = url.split('v=')[1].split(/[&?#]/)[0];
                else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1].split(/[?#&]/)[0];
            } catch (e) {}
            return id;
        }

        // 收藏切換
        function toggleFavorite(e, id) {
            e.preventDefault();
            e.stopPropagation();
            
            const idStr = id.toString();
            const index = favorites.indexOf(idStr);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(idStr);
            }
            
            saveToStorage();
            renderCards();
        }

        // 儲存至本地
        function saveToStorage() {
            try {
                localStorage.setItem('magic_favorites', JSON.stringify(favorites));
                updateFavStats();
            } catch (e) {
                alert("儲存失敗：瀏覽器禁止存取儲存空間。");
            }
        }

        // 更新統計
        function updateFavStats() {
            favCountHeader.textContent = favorites.length;
            favCountBtn.textContent = favorites.length;
        }

        // 匯出備份
        function exportFavorites() {
            const code = btoa(JSON.stringify(favorites));
            const promptMsg = "這是您的收藏代碼，請複製並妥善保存：";
            window.prompt(promptMsg, code);
        }

        // 匯入備份
        function importFavorites() {
            const code = window.prompt("請輸入匯出時取得的收藏代碼：");
            if (code) {
                try {
                    const imported = JSON.parse(atob(code));
                    if (Array.isArray(imported)) {
                        favorites = imported;
                        saveToStorage();
                        renderCards();
                        alert("匯入成功！");
                    }
                } catch (e) {
                    alert("無效的代碼，請檢查是否複製完全。");

            }
        }

        // 渲染卡片
        function renderCards() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = magicData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || 
                                    item.id.toString().includes(searchTerm) ||
                                    item.category.includes(searchTerm);
                
                let matchesFilter = true;
                if (currentFilter === 'favorites') {
                    matchesFilter = favorites.includes(item.id.toString());
                } else if (currentFilter === '未解答') {
                    matchesFilter = item.unsolved;
                } else if (currentFilter !== 'all') {
                    matchesFilter = item.category === currentFilter;
                }
                
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                videoGrid.innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <i class="fas fa-folder-open text-5xl text-slate-700 mb-4"></i>
                        <p class="text-slate-500">找不到符合條件的魔術影片</p>
                    </div>
                `;
            } else {
                videoGrid.innerHTML = filtered.map(item => {
                    const videoId = getYoutubeId(item.url);
                    const isFav = favorites.includes(item.id.toString());
                    return `
                        <div class="magic-card bg-slate-800 rounded-3xl overflow-hidden border border-slate-700/50 flex flex-col group">
                            <a href="${item.url}" target="_blank" class="relative aspect-video block no-underline">
                                <img src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <div class="youtube-icon-bg w-14 h-14 rounded-full flex items-center justify-center shadow-2xl">
                                        <i class="fas fa-play text-white text-xl ml-1"></i>
                                    </div>
                                </div>
                                <div class="absolute top-3 left-3 px-3 py-1 bg-slate-900/80 backdrop-blur-md rounded-full text-[10px] font-bold text-blue-400 border border-blue-500/30">
                                    #${item.id}
                                </div>
                                <div class="duration-badge absolute bottom-2 right-2 px-2 py-0.5 rounded text-[11px] font-medium text-white tracking-wider">
                                    ${item.duration}
                                </div>
                                ${item.unsolved ? `<div class="absolute top-3 right-12 px-3 py-1 bg-amber-500 rounded-full text-[10px] font-bold text-slate-950">未解答</div>` : ''}
                            </a>
                            <button onclick="toggleFavorite(event, '${item.id}')" class="fav-btn absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-900/80 backdrop-blur-md flex items-center justify-center border border-slate-700 hover:border-rose-500 z-10">
                                <i class="${isFav ? 'fas fa-heart text-rose-500 scale-110' : 'far fa-heart text-slate-400'}"></i>
                            </button>
                            <div class="p-5 flex-grow flex flex-col">
                                <a href="${item.url}" target="_blank" class="block no-underline">
                                    <h4 class="text-slate-100 font-bold text-lg mb-3 line-clamp-2 leading-tight group-hover:text-blue-400 transition-colors">${item.title}</h4>
                                </a>
                                <div class="mt-auto flex items-center justify-between">
                                    <span class="text-[10px] font-bold uppercase px-3 py-1 rounded-lg bg-slate-700/50 text-slate-400">${item.category}</span>
                                    <div class="text-slate-500 flex items-center gap-1.5 text-[10px] font-bold">
                                        <i class="fab fa-youtube ${item.url.includes('shorts') ? 'text-rose-500' : 'text-red-600'}"></i>
                                        <span>${item.url.includes('shorts') ? 'SHORTS' : 'VIDEO'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            totalCountEl.textContent = filtered.length;
        }

        // 事件監聽
        searchInput.addEventListener('input', renderCards);
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.category;
                renderCards();
            });
        });

        // 啟動程序
        window.onload = () => {
            initFavorites();
            updateFavStats();
            renderCards();
        };
    </script>
</body>
</html>
