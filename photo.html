    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        .photo-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .img-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3 / 2;
            background-color: #e2e8f0;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover .img-container img {
            transform: scale(1.1);
        }

        /* 燈箱背景 */
        #lightbox {
            display: none;
            backdrop-filter: blur(8px);
        }

        /* 標題圖案尺寸調整 */
        .header-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        @media (min-width: 768px) {
            .header-icon {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>

                <div>

    </div>

        const allPhotos = rawData.trim().split('\n').map(line => {
            const parts = line.split(' ');
            const fileId = parts[4].split('/d/')[1]?.split('/')[0];
            const directUrl = fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : '';
            
            return {
                id: parts[0],
                year: parts[1],
                cat1: parts[2],
                cat2: parts[3],
                url: directUrl
            };
        });

        let currentFilter = { year: '', cat1: '', cat2: '' };
        let currentPage = 1;
        const itemsPerPage = 9;

        function init() {
            const years = [...new Set(allPhotos.map(p => p.year))].sort().reverse();
            const cat1s = [...new Set(allPhotos.map(p => p.cat1))].sort();
            const cat2s = [...new Set(allPhotos.map(p => p.cat2))].sort();

            const populate = (id, opts) => {
                const s = document.getElementById(id);
                opts.forEach(o => s.innerHTML += `<option value="${o}">${o}</option>`);
            };

            populate('filterYear', years);
            populate('filterCat1', cat1s);
            populate('filterCat2', cat2s);

            ['filterYear', 'filterCat1', 'filterCat2'].forEach(id => {
                document.getElementById(id).addEventListener('change', e => {
                    currentFilter[id.replace('filter', '').toLowerCase()] = e.target.value;
                    currentPage = 1;
                    render();
                });
            });

            render();
        }

        function render() {
            const filtered = allPhotos.filter(p => 
                (!currentFilter.year || p.year === currentFilter.year) &&
                (!currentFilter.cat1 || p.cat1 === currentFilter.cat1) &&
                (!currentFilter.cat2 || p.cat2 === currentFilter.cat2)
            );

            document.getElementById('stats').textContent = `找到 ${filtered.length} 張照片`;

            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(start, start + itemsPerPage);

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = pageItems.map(p => `
                <div class="photo-card bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden cursor-pointer" onclick="openLightbox('${p.url}')">
                    <div class="img-container">
                        <img src="${p.url}" 
                             alt="${p.cat2}" 
                             loading="lazy" 
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400/e2e8f0/64748b?text=無法讀取 (請檢查Drive權限)';">
                    </div>
                    <div class="p-5">
                        <div class="flex gap-2 mb-2">
                            <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded">${p.year}</span>
                            <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded">${p.cat1}</span>
                        </div>
                        <h3 class="font-bold text-slate-800">${p.cat2}</h3>
                    </div>
                </div>
            `).join('');

            renderPagination(filtered.length);
        }

        function renderPagination(total) {
            const pages = Math.ceil(total / itemsPerPage);
            const container = document.getElementById('pagination');
            if (pages <= 1) { container.innerHTML = ''; return; }

            let html = '';
            for (let i = 1; i <= pages; i++) {
                const active = i === currentPage ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 hover:bg-slate-50';
                html += `<button onclick="setPage(${i})" class="w-10 h-10 rounded-xl font-medium transition-all border border-slate-100 ${active}">${i}</button>`;
            }
            container.innerHTML = html;
        }

        window.setPage = p => { currentPage = p; render(); window.scrollTo({top:0, behavior:'smooth'}); };
        window.openLightbox = url => { 
            const lb = document.getElementById('lightbox');
            document.getElementById('lightboxImg').src = url;
            lb.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
        window.closeLightbox = () => {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        window.onload = init;
    </script>
