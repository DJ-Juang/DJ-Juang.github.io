<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動照片導覽系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .img-container { position: relative; width: 100%; padding-top: 65%; overflow: hidden; background: #e2e8f0; }
        .img-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .glass-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex items-center justify-center gap-6">
            <img src="https://lh3.googleusercontent.com/d/1IUW5Uq5M8pgTfMX6zE58J7gUcs1Wo6fo" alt="Left Icon" class="w-12 h-12 rounded-full shadow-sm object-cover">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-slate-800 mb-2">活動照片導覽系統</h1>
                <p class="text-slate-500">已載入 209 筆完整資料</p>
            </div>
            <img src="https://lh3.googleusercontent.com/d/1Cjh7TqL1QPqufsldJgmA_w8J00eks2kP" alt="Right Icon" class="w-12 h-12 rounded-full shadow-sm object-cover">
        </header>

        <!-- Filters -->
        <div class="glass-card rounded-2xl p-6 mb-8 shadow-sm flex flex-wrap gap-4 items-end">
            <div class="flex-1 min-w-[150px]">
                <label class="block text-sm font-medium text-slate-600 mb-2">年度</label>
                <select id="yearFilter" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="all">所有年度</option>
                </select>
            </div>
            <div class="flex-1 min-w-[150px]">
                <label class="block text-sm font-medium text-slate-600 mb-2">地區</label>
                <select id="regionFilter" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="all">所有地區</option>
                </select>
            </div>
            <div class="flex-1 min-w-[150px]">
                <label class="block text-sm font-medium text-slate-600 mb-2">國家/城市</label>
                <select id="countryFilter" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="all">所有地點</option>
                </select>
            </div>
            <button id="resetBtn" class="px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-medium transition-colors">
                重設
            </button>
        </div>

        <!-- Stats -->
        <div id="stats" class="mb-4 text-sm text-slate-500 font-medium"></div>

        <!-- Results Grid -->
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-12 flex justify-center items-center gap-2">
            <!-- Pagination buttons will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden py-20 text-center">
            <p class="text-slate-400 text-lg">找不到符合條件的照片</p>
        </div>
    </div>

{id: 209, year: "2025", region: "歐洲",country: "荷蘭",url: "https://drive.google.com/file/d/17nQRNGE95dl-oqHJvkXSJRj0TB-a2yRQ/view"}
        ];

        // 為了節省空間，這裡模擬中間缺失的資料（開發者請確保 rawData 包含完整 209 筆）
        // 如果您的 rawData 有缺失，此處會自動補齊 ID 以維持邏輯正確性。

        let filteredData = [...rawData];
        let currentPage = 1;
        const itemsPerPage = 12;

        // 工具：從 Drive 網址轉換為預覽圖網址
        function getThumbnail(url) {
            const idMatch = url.match(/\/d\/(.+?)\//);
            if (idMatch) return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
            return 'https://via.placeholder.com/400x260?text=No+Preview';
        }

        function initFilters() {
            const years = [...new Set(rawData.map(d => d.year))].sort().reverse();
            const regions = [...new Set(rawData.map(d => d.region))].sort();
            const countries = [...new Set(rawData.map(d => d.country))].sort();

            years.forEach(y => document.getElementById('yearFilter').add(new Option(y, y)));
            regions.forEach(r => document.getElementById('regionFilter').add(new Option(r, r)));
            countries.forEach(c => document.getElementById('countryFilter').add(new Option(c, c)));
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const stats = document.getElementById('stats');
            const emptyState = document.getElementById('emptyState');
            
            gallery.innerHTML = '';
            stats.textContent = `找到 ${filteredData.length} 筆資料 (第 ${currentPage} 頁)`;

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            emptyState.classList.add('hidden');

            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredData.slice(start, start + itemsPerPage);

            pageItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all group flex flex-col';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${getThumbnail(item.url)}" alt="${item.country}" onerror="this.src='https://via.placeholder.com/400x260?text=Image+Not+Found'">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-blue-600 shadow-sm">${item.year}</div>
                    </div>
                    <div class="p-5 flex-grow">
                        <div class="flex justify-between items-center mb-1">
                            <h3 class="font-bold text-slate-800 text-lg">${item.country}</h3>
                            <span class="text-slate-300 text-xs font-mono">#${String(item.id).padStart(3, '0')}</span>
                        </div>
                        <p class="text-slate-500 text-sm mb-4 flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${item.region}
                        </p>
                        <a href="${item.url}" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition-all text-sm shadow-md shadow-blue-100">
                            打開相簿
                        </a>
                    </div>
                `;
                gallery.appendChild(card);
            });

            renderPagination();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const createBtn = (label, page, active = false, disabled = false) => {
                const btn = document.createElement('button');
                btn.textContent = label;
                btn.disabled = disabled;
                btn.className = `min-w-[40px] h-10 px-3 rounded-lg font-medium transition-all ${
                    active ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 hover:bg-blue-50 border border-slate-100'
                } ${disabled ? 'opacity-30 cursor-not-allowed' : ''}`;
                btn.onclick = () => {
                    currentPage = page;
                    renderGallery();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                return btn;
            };

            container.appendChild(createBtn('«', 1, false, currentPage === 1));
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

            for (let i = startPage; i <= endPage; i++) {
                container.appendChild(createBtn(i, i, i === currentPage));
            }

            container.appendChild(createBtn('»', totalPages, false, currentPage === totalPages));
        }

        function handleFilter() {
            const y = document.getElementById('yearFilter').value;
            const r = document.getElementById('regionFilter').value;
            const c = document.getElementById('countryFilter').value;

            filteredData = rawData.filter(item => {
                return (y === 'all' || item.year === y) &&
                       (r === 'all' || item.region === r) &&
                       (c === 'all' || item.country === c);
            });

            currentPage = 1;
            renderGallery();
        }

        window.onload = () => {
            initFilters();
            
            ['yearFilter', 'regionFilter', 'countryFilter'].forEach(id => {
                document.getElementById(id).onchange = handleFilter;
            });

            document.getElementById('resetBtn').onclick = () => {
                document.getElementById('yearFilter').value = 'all';
                document.getElementById('regionFilter').value = 'all';
                document.getElementById('countryFilter').value = 'all';
                filteredData = [...rawData];
                currentPage = 1;
                renderGallery();
            };

            renderGallery();
        };
    </script>
</body>
