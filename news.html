<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 今日頭條 - 全自動即時版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .news-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .skeleton { background: #e2e8f0; border-radius: 0.5rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .modal-active { overflow: hidden; }
        .modal-enter { animation: modalIn 0.3s ease-out; }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="text-slate-800">

    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-blue-600 tracking-tight">AI 今日頭條 <span id="live-indicator" class="text-red-500 text-sm animate-pulse">● LIVE</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <div id="current-date" class="text-slate-500 text-sm font-medium">載入中...</div>
                    <button onclick="forceRefresh()" class="text-slate-400 hover:text-blue-600 transition-colors" title="強制更新當前資料">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="loader" class="space-y-10">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 skeleton h-[400px]"></div>
                <div class="skeleton h-[400px]"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="skeleton h-48"></div>
                <div class="skeleton h-48"></div>
                <div class="skeleton h-48"></div>
                <div class="skeleton h-48"></div>
            </div>
        </div>
        <div id="news-container" class="hidden"></div>
    </main>

    <div id="news-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute inset-x-4 bottom-0 top-10 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:max-w-2xl w-full bg-white rounded-t-3xl md:rounded-3xl shadow-2xl overflow-hidden modal-enter">
            <div class="h-full flex flex-col">
                <div class="p-4 border-b flex justify-between items-center bg-white sticky top-0">
                    <span class="text-sm font-bold text-blue-600">即時報導</span>
                    <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="modal-content" class="flex-grow overflow-y-auto p-6 md:p-10">
                    <div id="modal-loader" class="space-y-4">
                        <div class="skeleton h-8 w-3/4"></div>
                        <div class="skeleton h-4 w-1/4"></div>
                        <div class="space-y-2 pt-4">
                            <div class="skeleton h-4 w-full"></div>
                            <div class="skeleton h-4 w-full"></div>
                        </div>
                    </div>
                    <div id="modal-body" class="hidden prose prose-slate max-w-none"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-slate-400 py-10 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm mb-2">新聞數據由 Gemini 2.5 Flash 實時生成</p>
            <p class="text-xs text-slate-500">&copy; <span id="footer-year"></span> AI 今日頭條 - 全自動即時採編</p>
        </div>
    </footer>

    <script>
        const apiKey = ""; 
        const model = "gemini-2.5-flash-preview-09-2025";

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        }

        const fullDateStr = getTodayString();
        document.getElementById('current-date').innerText = fullDateStr;
        document.getElementById('footer-year').innerText = new Date().getFullYear();

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return await response.json();
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(r => setTimeout(r, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        async function updateNews(force = false) {
            const container = document.getElementById('news-container');
            const loader = document.getElementById('loader');
            
            container.classList.add('hidden');
            loader.classList.remove('hidden');

            const systemPrompt = `你是一個專業的新聞主編。目前的精確日期是 ${fullDateStr}。
            你的任務：
            1. 使用 Google Search 搜尋「${fullDateStr} 台灣與國際重要新聞」。
            2. 回傳純 JSON。結構必須嚴格如下：
            {
              "hero": {"title": "...", "source": "...", "time": "...", "description": "..."},
              "international": [{"title": "...", "source": "...", "time": "..."}],
              "economy": [{"title": "...", "source": "...", "description": "..."}],
              "society": [{"title": "...", "description": "..."}],
              "politics": [{"title": "...", "description": "..."}]
            }`;

            const userQuery = `請整理 ${fullDateStr} 的台灣新聞頭條。`;

            try {
                const result = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ "google_search": {} }],
                            generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
                        })
                    }
                );

                let rawText = result.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json|```/g, '').trim();
                const newsData = JSON.parse(rawText);
                
                renderNews(newsData);
                localStorage.setItem('cached_news', JSON.stringify({ date: fullDateStr, data: newsData }));
            } catch (error) {
                console.error("更新失敗:", error);
                loader.innerHTML = `<div class="text-center py-20 text-red-500 font-bold">系統繁忙中，請點擊右上角同步按鈕重試。</div>`;
            }
        }

        function renderNews(rawContent) {
            if (!rawContent) return;

            // 自動偵測資料結構：有些 AI 會把內容包在 .news 下
            const data = rawContent.news || rawContent;
            const container = document.getElementById('news-container');
            
            // 安全處理標題與單引號轉義
            const formatTitle = (t) => (t || "無標題").replace(/'/g, "\\'").replace(/"/g, '&quot;');

            // 輔助函式：從可能的欄位名稱中抓取陣列
            const getSafeArray = (key) => {
                const list = data[key] || [];
                return Array.isArray(list) ? list.filter(i => i && i.title) : [];
            };

            // 抓取頭條
            const hero = data.hero || getSafeArray('international')[0] || getSafeArray('politics')[0] || { title: "今日暫無重大快訊", source: "系統" };

            container.innerHTML = `
                <!-- 頭條與國際 -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
                    <div class="lg:col-span-2 cursor-pointer group" onclick="openNews('${formatTitle(hero.title)}')">
                        <div class="relative overflow-hidden rounded-2xl shadow-lg h-[400px]">
                            <div class="absolute inset-0 news-gradient opacity-80 group-hover:opacity-70 transition-opacity"></div>
                            <div class="absolute inset-0 flex flex-col justify-end p-8 text-white">
                                <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded w-fit mb-3">今日熱門</span>
                                <h1 class="text-3xl md:text-4xl font-bold mb-4 leading-tight">${hero.title}</h1>
                                <div class="flex items-center text-sm text-slate-200">
                                    <span class="mr-4"><i class="far fa-clock mr-1"></i> ${hero.time || '剛剛'}</span>
                                    <span>${hero.source || '綜合報導'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 overflow-y-auto max-h-[400px]">
                        <h2 class="text-lg font-bold mb-4 border-l-4 border-blue-600 pl-3">國際焦點</h2>
                        <div class="space-y-4">
                            ${getSafeArray('international').slice(0, 8).map(n => `
                                <article class="group cursor-pointer" onclick="openNews('${formatTitle(n.title)}')">
                                    <h3 class="font-medium group-hover:text-blue-600 transition-colors line-clamp-2 text-sm">${n.title}</h3>
                                    <p class="text-[10px] text-slate-400 mt-1">${n.source || '即時電訊'}</p>
                                </article>
                                <hr class="border-slate-100 last:hidden">
                            `).join('') || '<p class="text-slate-400 text-sm">暫無國際新聞</p>'}
                        </div>
                    </div>
                </div>

                <!-- 財經區塊 -->
                <section class="mb-10">
                    <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fas fa-chart-line text-blue-600 mr-2"></i> 財經與產業</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
                        ${getSafeArray('economy').map(item => `
                            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer hover:shadow-md transition-shadow group flex flex-col h-full" onclick="openNews('${formatTitle(item.title)}')">
                                <h3 class="font-bold text-sm mb-2 line-clamp-2 group-hover:text-blue-600 transition-colors">${item.title}</h3>
                                <p class="text-xs text-slate-500 mb-3 flex-grow line-clamp-2">${item.description || ''}</p>
                                <div class="text-[10px] text-slate-400 font-medium uppercase">${item.source || '財經速報'}</div>
                            </div>
                        `).join('') || '<div class="col-span-full py-10 text-center text-slate-400">目前尚無財經更新</div>'}
                    </div>
                </section>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <!-- 社會 -->
                    <section>
                        <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fas fa-users text-blue-600 mr-2"></i> 社會民生</h2>
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
                            ${getSafeArray('society').map(item => `
                                <div class="cursor-pointer group" onclick="openNews('${formatTitle(item.title)}')">
                                    <h3 class="font-bold text-base mb-1 group-hover:text-blue-600 transition-colors">${item.title}</h3>
                                    <p class="text-sm text-slate-500 line-clamp-2">${item.description || ''}</p>
                                </div>
                                <hr class="border-slate-100 last:hidden">
                            `).join('') || '<p class="text-slate-400">暫無社會快訊</p>'}
                        </div>
                    </section>
                    <!-- 政治 -->
                    <section>
                        <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fas fa-landmark text-blue-600 mr-2"></i> 政治局勢</h2>
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
                            ${getSafeArray('politics').map(item => `
                                <div class="cursor-pointer group" onclick="openNews('${formatTitle(item.title)}')">
                                    <h3 class="font-bold text-base mb-1 group-hover:text-blue-600 transition-colors">${item.title}</h3>
                                    <p class="text-sm text-slate-500 line-clamp-2">${item.description || ''}</p>
                                </div>
                                <hr class="border-slate-100 last:hidden">
                            `).join('') || '<p class="text-slate-400">暫無政治消息</p>'}
                        </div>
                    </section>
                </div>
            `;
            document.getElementById('loader').classList.add('hidden');
            container.classList.remove('hidden');
        }

        async function openNews(title) {
            if (!title) return;
            const modal = document.getElementById('news-modal');
            const loader = document.getElementById('modal-loader');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');
            document.body.classList.add('modal-active');
            loader.classList.remove('hidden');
            body.classList.add('hidden');

            try {
                const result = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `標題：「${title}」。請撰寫一篇約 400 字的深度報導（日期：${fullDateStr}）。` }] }],
                            systemInstruction: { parts: [{ text: "你是記者。輸出 HTML 格式內容。" }] }
                        })
                    }
                );
                const content = result.candidates[0].content.parts[0].text;
                body.innerHTML = `
                    <h1 class="text-2xl font-bold mb-2">${title}</h1>
                    <div class="text-xs text-slate-400 mb-6 italic">發布日期：${fullDateStr}</div>
                    <div class="text-slate-700 leading-relaxed space-y-4">${content}</div>
                    <div class="mt-8 p-4 bg-slate-50 rounded-xl text-center">
                        <a href="https://www.google.com/search?q=${encodeURIComponent(title)}" target="_blank" class="text-blue-600 text-sm font-bold hover:underline">
                            前往 Google 驗證此新聞 <i class="fas fa-external-link-alt ml-1 text-xs"></i>
                        </a>
                    </div>
                `;
                loader.classList.add('hidden');
                body.classList.remove('hidden');
            } catch (error) {
                body.innerHTML = `<p class="py-10 text-center">無法載入詳細內容。</p>`;
                loader.classList.add('hidden');
                body.classList.remove('hidden');
            }
        }

        function forceRefresh() {
            localStorage.removeItem('cached_news');
            updateNews();
        }

        function closeModal() {
            document.getElementById('news-modal').classList.add('hidden');
            document.body.classList.remove('modal-active');
        }

        window.onload = () => {
            const cached = localStorage.getItem('cached_news');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed.date === fullDateStr) { 
                        renderNews(parsed.data); 
                        return; 
                    }
                } catch (e) {
                    localStorage.removeItem('cached_news');
                }
            }
            updateNews();
        };
    </script>
</body>
</html>
